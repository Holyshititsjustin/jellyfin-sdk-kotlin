build:
  maxIssues: 0

complexity:
  NestedBlockDepth:
    threshold: 6
  TooManyFunctions:
    thresholdInFiles: 15
    thresholdInClasses: 15
    thresholdInInterfaces: 15
    thresholdInObjects: 15
    thresholdInEnums: 15
    ignoreDeprecated: true

naming:
  ConstructorParameterNaming:
    excludes:
      - "**/kotlin-generated/**"
      - "**/generated/**"
  FunctionParameterNaming:
    excludes:
      - "**/kotlin-generated/**"
      - "**/generated/**"
  VariableNaming:
    excludes:
      - "**/kotlin-generated/**"
      - "**/generated/**"

style:
  MagicNumber:
    excludes:
      - "**/kotlin-generated/**"
      - "**/generated/**"
  LoopWithTooManyJumpStatements:
    maxJumpCount: 6
  MaxLineLength:
    excludes:
      - "**/kotlin-generated/**"
      - "**/generated/**"
  ReturnCount:
    max: 6
  ThrowsCount:
    max: 6
